name: Canywhere
options:
  bundleIdPrefix: com.canywhere
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
schemes:
  Canywhere:
    build:
      targets:
        Canywhere: all
        CanywhereWidgets: [run]
    run:
      config: Debug
    archive:
      config: Release
targets:
  Canywhere:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - project.yml
          - "*.xcodeproj"
          - "*.lock"
          - "build"
          - "build/**"
          - "DerivedData"
          - "Widgets"
          - "Widgets/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canywhere.mobile
        PRODUCT_NAME: Canywhere
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 7P6XVLAF2L
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: CanywhereWidgets
      - sdk: CryptoKit.framework
      - sdk: Network.framework
      - sdk: AVFoundation.framework
      - sdk: LocalAuthentication.framework
      - sdk: UserNotifications.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework

  CanywhereWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: LiveActivities/CanywhereActivityAttributes.swift
      - path: LiveActivities/LiveActivityIntents.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canywhere.mobile.widgets
        PRODUCT_NAME: CanywhereWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 7P6XVLAF2L
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
