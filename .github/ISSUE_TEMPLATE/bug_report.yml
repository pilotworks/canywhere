name: 🐛 Bug Report
description: Report a reproducible bug or unexpected behavior in Canywhere
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem quickly.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Canywhere is experiencing the bug?
      options:
        - Host Server Daemon (Rust / Axum)
        - OpenAI Codex Adapter
        - Google Antigravity (agy) Adapter
        - Desktop UI (React / Vite)
        - Desktop App (Tauri v2)
        - iOS Mobile Client (SwiftUI)
        - Protocol / Codegen
        - Networking (mDNS / Tailscale)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Rust version, iOS version, Node/Bun version, and assistant version.
      placeholder: e.g. macOS Sonoma 14.5, Rust 1.84, iOS 17.5, Bun 1.2, Codex 0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Start server with `make server`
        2. Pair iOS client using QR code
        3. Trigger command execution turn...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Terminal Output
      description: Please copy and paste any relevant logs from terminal or browser devtools console.
      render: shell
