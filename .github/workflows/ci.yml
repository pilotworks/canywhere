name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Web UI, Typecheck & Codegen Drift Verification
  # ---------------------------------------------------------------------------
  ui-and-codegen:
    name: UI & Codegen Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Verify Codegen Drift
        run: |
          bun run codegen
          if ! git diff --exit-code; then
            echo "❌ Code generation is out of sync!"
            echo "Please run 'make codegen' locally and commit the generated changes."
            exit 1
          fi

      - name: Install Desktop UI dependencies
        working-directory: packages/desktop-ui
        run: bun install --frozen-lockfile

      - name: Typecheck Desktop UI
        working-directory: packages/desktop-ui
        run: bun run typecheck

      - name: Run Desktop UI tests
        working-directory: packages/desktop-ui
        run: bun test

      - name: Build Desktop UI
        working-directory: packages/desktop-ui
        run: bun run build

  # ---------------------------------------------------------------------------
  # 2. Rust Workspace (Clippy, Format, Unit & Integration Tests)
  # ---------------------------------------------------------------------------
  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri / GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Rust Formatting
        run: cargo fmt --all --check

      - name: Cargo Check
        run: cargo check --workspace

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets

      - name: Run Cargo Tests
        run: cargo test --workspace
