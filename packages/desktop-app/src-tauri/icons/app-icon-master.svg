<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- macOS Dock Drop Shadows -->
    <filter id="macShadow" x="-20%" y="-20%" width="140%" height="150%">
      <!-- Ambient blur shadow -->
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.45" />
      <!-- Contact shadow -->
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Deep Technical Obsidian Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="60%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#06070A" />
    </radialGradient>

    <!-- Subtle Technical Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38435C" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#181D2A" stop-opacity="0.2" />
    </linearGradient>

    <!-- Electric Sky Blue Accent Gradient -->
    <linearGradient id="skyGrad" x1="288" y1="200" x2="408" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background Base with macOS Squircle & Shadow -->
  <rect x="100" y="92" width="824" height="824" rx="185" ry="185" fill="url(#bgGrad)" filter="url(#macShadow)" />

  <!-- Subtle Rim Border -->
  <rect x="101" y="93" width="822" height="822" rx="184" ry="184" stroke="url(#rimGrad)" stroke-width="3" fill="none" />

  <!-- Centered Scaled Logo Mark -->
  <g transform="translate(200, 210) scale(1.15)">
    <!-- Architectural Monospace C Bracket -->
    <path
      d="M 352 136 L 224 136 C 162.144 136 112 186.144 112 248 L 112 264 C 112 325.856 162.144 376 224 376 L 352 376"
      stroke="#FFFFFF"
      stroke-width="50"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Outbound Forward Prompt Chevron -->
    <path
      d="M 288 200 L 344 256 L 288 312"
      stroke="url(#skyGrad)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Remote Tether Beacon Node -->
    <circle cx="408" cy="256" r="22" fill="url(#skyGrad)" />
  </g>
</svg>
