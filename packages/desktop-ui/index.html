<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Canywhere</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("canywhere-theme");
          var isDark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches) || (saved === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.backgroundColor = "#09090b";
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.backgroundColor = "#ffffff";
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      html.dark, html.dark body, html.dark #root {
        background-color: #09090b;
        color-scheme: dark;
      }
      html:not(.dark), html:not(.dark) body, html:not(.dark) #root {
        background-color: #ffffff;
        color-scheme: light;
      }
    </style>
  </head>
  <body class="bg-[var(--background)] text-[var(--foreground)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
